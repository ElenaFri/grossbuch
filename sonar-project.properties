# Configuration d'analyse Sonar — exclusions d'alertes documentées.
#
# Ce fichier ne déclare QUE des exclusions d'alertes ; la clé de projet,
# l'organisation et la configuration du build-wrapper C++ restent fournies par
# l'invocation du scanner (ligne de commande ou intégration). Voir docs/adr/0018.

sonar.issue.ignore.multicriteria=qtOwnership,qtNullFp

# cpp:S5025 — « Replace the use of new / Rewrite the code so that you no longer
# need this delete ». Faux positif pour Qt : l'allocation par new avec transfert
# de propriété au widget parent (modèle parent-enfant) est l'idiome attendu du
# framework ; la mémoire est libérée automatiquement par le parent. Les réécrire
# en pointeurs intelligents casserait la gestion de durée de vie de Qt.
sonar.issue.ignore.multicriteria.qtOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.qtOwnership.resourceKey=src/ui/**/*

# cpp:S2259 — « Called C++ object pointer is null ». Faux positif dans les tests :
# le moteur symbolique ne modélise pas l'arrêt provoqué par la macro QVERIFY, et
# croit à tort qu'un pointeur déjà vérifié peut être nul. Les tests ajoutent déjà
# une garde explicite ; on neutralise les cas résiduels dans le dossier de tests.
sonar.issue.ignore.multicriteria.qtNullFp.ruleKey=cpp:S2259
sonar.issue.ignore.multicriteria.qtNullFp.resourceKey=tests/**/*
