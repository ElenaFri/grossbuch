<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Icône grossbuch : un grand livre comptable portant le symbole euro. -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6cdf"/>
      <stop offset="1" stop-color="#1b4fab"/>
    </linearGradient>
  </defs>

  <!-- Ombre portée douce -->
  <rect x="26" y="20" width="80" height="92" rx="6" fill="#000000" opacity="0.12"/>

  <!-- Dos et couverture du livre -->
  <rect x="22" y="16" width="80" height="92" rx="6" fill="url(#cover)"/>
  <rect x="22" y="16" width="14" height="92" rx="6" fill="#163f88"/>

  <!-- Pages -->
  <rect x="40" y="24" width="56" height="76" rx="3" fill="#f7f9fc"/>
  <!-- Lignes du registre -->
  <g stroke="#c3d0e6" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="38" x2="88" y2="38"/>
    <line x1="48" y1="50" x2="88" y2="50"/>
    <line x1="48" y1="86" x2="88" y2="86"/>
  </g>

  <!-- Symbole euro -->
  <text x="68" y="80" font-family="DejaVu Sans, Verdana, sans-serif" font-size="46"
        font-weight="bold" fill="#1b4fab" text-anchor="middle">€</text>
</svg>
